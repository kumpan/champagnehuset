name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same branch to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job name === the status-check name you require in the ruleset: "biome"
  biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .

  # Job name === the status-check name you require in the ruleset: "typecheck"
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # next-env.d.ts + .next/types are gitignored, so a fresh checkout lacks
      # the module declarations for image imports and typed routes. Generate
      # them first, or tsc reports false "Cannot find module '*.png'" errors.
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit
